[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "52pojie"
version = "1.0.0"
description = "52pojie.cn (吾爱破解) 命令行阅读器"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "curl_cffi>=0.6",
    "beautifulsoup4>=4.11",
]

[project.scripts]
52pojie = "pojie:main"

[tool.setuptools]
py-modules = ["pojie", "_ui", "_pager", "_store", "_browser", "_browser_local"]
